<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vizuroiu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 80% 10%, #c45a1a 0%, transparent 45%),
                radial-gradient(ellipse at 20% 80%, #e06820 0%, transparent 40%),
                radial-gradient(ellipse at 15% 40%, #2a3a4a 0%, transparent 50%),
                #1a1e24;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px 60px;
  }

  .container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Profile photo */
  .avatar {
    width: 100px;
    height: 100px;
    margin-bottom: 16px;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Name */
  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }

  /* Tagline */
  .tagline {
    font-size: 0.875rem;
    color: #fff;
    margin-bottom: 28px;
    font-weight: 400;
  }
  .tagline .hl {
    color: #e06820;
    font-weight: 700;
  }

  /* Link buttons */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 36px;
  }

  a.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    width: 100%;
    padding: 14px 20px;
    border-radius: 14px;
    background: #fff;
    color: #111;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    border: 1px solid rgba(0,0,0,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    gap: 10px;
  }
  a.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  a.btn:active {
    transform: translateY(0);
  }

  a.btn svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  /* Platform colors */
  a.btn.youtube  { background: #ff0000; color: #fff; border-color: #ff0000; }
  a.btn.tiktok   { background: #000; color: #fff; border-color: #000; }
  a.btn.instagram {
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    color: #fff;
    border-color: transparent;
  }
  a.btn.facebook { background: #1877f2; color: #fff; border-color: #1877f2; }
  a.btn.website  { background: #fff; color: #111; }

  /* Share button area */
  .share-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    color: #999;
    font-size: 0.8rem;
  }

  .share-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 20px;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.1);
    font-size: 0.8rem;
    font-weight: 600;
    color: #333;
    cursor: pointer;
    text-decoration: none;
    transition: box-shadow 0.15s;
  }
  .share-btn:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

  .footer {
    font-size: 0.7rem;
    color: #bbb;
    margin-top: 20px;
    letter-spacing: 0.05em;
  }
</style>
</head>
